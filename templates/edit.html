<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Entry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Edit Entry #{{ entry[0] }}</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class=flashes>
        {% for category, message in messages %}
          <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('edit', id=entry[0]) }}" method="post" class="entry-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ entry[1] }}" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ entry[2] }}" required>

        <label for="started_on">Started On:</label>
        <input type="datetime-local" id="started_on" name="started_on" value="{{ entry[3] }}">
        <small>Original: {{ entry[3] if entry[3] else 'N/A' }}</small>

        <button type="submit">Update Entry</button>
        <a href="{{ url_for('index') }}" class="cancel-button">Cancel</a>
    </form>

</body>
</html>
